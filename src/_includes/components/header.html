<style>
  :root {
    --pd-primary: #1A1A1A;
    --pd-accent: #D32F2F;
    --pd-light: #F4F6F9;
    --pd-white: #ffffff;
    --pd-font-display: 'Anton', sans-serif;
    --pd-font-body: 'Barlow', sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .pd-topbar {
    background: var(--pd-primary);
    color: var(--pd-white);
    font-family: var(--pd-font-body);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.45rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    letter-spacing: 0.02em;
  }

  .pd-topbar__tagline {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--pd-light);
  }

  .pd-topbar__tagline-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--pd-accent);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .pd-topbar__right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .pd-topbar__phone {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--pd-white);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
  }

  .pd-topbar__phone:hover { color: var(--pd-accent); }

  .pd-topbar__phone svg { flex-shrink: 0; }

  .pd-topbar__socials {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .pd-topbar__socials a {
    display: flex;
    align-items: center;
    color: var(--pd-light);
    opacity: 0.8;
    transition: opacity 0.2s, color 0.2s;
  }

  .pd-topbar__socials a:hover { opacity: 1; color: var(--pd-accent); }

  .pd-header {
    background: var(--pd-white);
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    font-family: var(--pd-font-body);
  }

  .pd-header__inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    gap: 1.5rem;
  }

  .pd-header__logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    flex-shrink: 0;
  }

  .pd-header__logo img {
    height: 96px;
    width: auto;
    display: block;
  }

  .pd-header__logo-fallback {
    font-family: var(--pd-font-display);
    font-size: 1.25rem;
    color: var(--pd-primary);
    line-height: 1.1;
    letter-spacing: 0.01em;
  }

  .pd-header__logo-fallback span {
    color: var(--pd-accent);
  }

  .pd-header__nav {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    list-style: none;
  }

  .pd-header__nav a {
    font-family: var(--pd-font-body);
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--pd-primary);
    text-decoration: none;
    padding: 0.45rem 0.75rem;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .pd-header__nav a:hover {
    color: var(--pd-accent);
    background: rgba(211,47,47,0.06);
  }

  .pd-header__cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--pd-accent);
    color: var(--pd-white);
    font-family: var(--pd-font-display);
    font-size: 1rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    padding: 0.6rem 1.6rem;
    border-radius: 999px;
    white-space: nowrap;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 3px 14px rgba(211,47,47,0.28);
    flex-shrink: 0;
  }

  .pd-header__cta:hover {
    background: #b71c1c;
    transform: translateY(-1px);
    box-shadow: 0 5px 18px rgba(211,47,47,0.38);
  }

  .pd-header__hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    width: 40px;
    height: 40px;
    background: none;
    border: 2px solid var(--pd-primary);
    border-radius: 8px;
    cursor: pointer;
    padding: 6px;
    flex-shrink: 0;
  }

  .pd-header__hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--pd-primary);
    border-radius: 2px;
    transition: transform 0.28s, opacity 0.2s;
    transform-origin: center;
  }

  .pd-header__hamburger[aria-expanded="true"] span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  .pd-header__hamburger[aria-expanded="true"] span:nth-child(2) {
    opacity: 0;
  }
  .pd-header__hamburger[aria-expanded="true"] span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .pd-header__mobile-nav {
    display: none;
    flex-direction: column;
    background: var(--pd-white);
    border-top: 1px solid rgba(0,0,0,0.07);
    padding: 1rem 1.25rem 1.25rem;
    gap: 0.2rem;
  }

  .pd-header__mobile-nav.is-open { display: flex; }

  .pd-header__mobile-nav a {
    font-family: var(--pd-font-body);
    font-size: 1rem;
    font-weight: 600;
    color: var(--pd-primary);
    text-decoration: none;
    padding: 0.65rem 0.75rem;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
    letter-spacing: 0.01em;
  }

  .pd-header__mobile-nav a:hover {
    color: var(--pd-accent);
    background: rgba(211,47,47,0.06);
  }

  .pd-header__mobile-nav .pd-header__cta {
    margin-top: 0.5rem;
    width: 100%;
    font-size: 1.05rem;
    padding: 0.75rem 1.5rem;
  }

  @media (max-width: 767px) {
    .pd-topbar { flex-wrap: wrap; gap: 0.35rem; }
    .pd-topbar__tagline { display: none; }
    .pd-header__nav,
    .pd-header__cta { display: none; }
    .pd-header__hamburger { display: flex; }
  }

  @media (min-width: 768px) {
    .pd-header__mobile-nav { display: none !important; }
  }
</style>

<script>
  (function() {
    var btn = document.getElementById('pd-hamburger');
    var nav = document.getElementById('pd-mobile-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function() {
      var isOpen = nav.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    nav.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        nav.classList.remove('is-open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
